name: Release

# Push a tag to publish a release:
#   v0.9.0        -> BUILD 0.9.0,        a normal release
#   v0.9.0-beta   -> BUILD 0.9.0-beta,   marked as a pre-release
#   v1.0.0-rc-1   -> BUILD 1.0.0-rc-1,   marked as a pre-release
# The zip is always named CrewSwap-<x.y.z>.zip. Release notes come from the matching
# "## [x.y.z]" section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - name: Run tests
        run: |
          set -o pipefail
          lua5.2 tests/run.lua | tee test-output.txt
          tail -n 1 test-output.txt | grep -Eq '^[1-9][0-9]* passed, 0 failed$'
      - name: Work out the version from the tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME#v}"                  # 1.0.0-rc-1
          version="${tag%%-*}"                 # 1.0.0
          suffix=""
          if [[ "$tag" == *-* ]]; then suffix="${tag#*-}"; fi   # rc-1 (may itself contain '-')
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::tag '$REF_NAME' does not start with a version like v0.9.0"
            exit 1
          fi
          {
            echo "version=$version"
            echo "suffix=$suffix"
            if [[ -n "$suffix" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Package
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SUFFIX: ${{ steps.ver.outputs.suffix }}
        run: |
          set -o pipefail
          zip_path="$(tools/package.sh "$VERSION" ${SUFFIX:+"$SUFFIX"})"
          unzip -l "$zip_path"
          expected="$VERSION${SUFFIX:+-$SUFFIX}"
          unzip -p "$zip_path" CrewSwap/Lua/crewswap/shared/build.lua | grep -q "BUILD = '$expected'"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP_NAME: CrewSwap-${{ steps.ver.outputs.version }}.zip
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if (index($0, "[" ver "]")) p = 1; next }
            p { print }
          ' CHANGELOG.md > changelog_section.md
          {
            if [[ -s changelog_section.md ]]; then
              cat changelog_section.md
            else
              echo "See the [changelog](https://mrmcepic.github.io/barotrauma-crewswap/book/changelog.html)."
            fi
            echo
            echo "---"
            echo
            echo "**Install:** download \`$ZIP_NAME\` below and unzip it into your server's \`LocalMods\` folder."
            echo "The server and every player who wants to switch also need Lua for Barotrauma."
            echo "See the [installation guide](https://mrmcepic.github.io/barotrauma-crewswap/book/guide/server-install.html)."
          } > release_notes.md
          echo "Release notes:"
          cat release_notes.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: CrewSwap ${{ github.ref_name }}
          body_path: release_notes.md
          files: ${{ steps.pkg.outputs.zip }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}

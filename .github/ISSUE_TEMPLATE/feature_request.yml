name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you're after and why.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What would this solve? What's awkward or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work in game?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that helps (screenshots, how vanilla singleplayer handles it, other mods that do something similar).
    validations:
      required: false
